[project]
name = "local-connect-status"
version = "0.1.0"
description = "Evidence-backed progress reporting for the Local Connect apps"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lcstatus"]
